name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_LIVE_OLLAMA_TESTS: '0'
      RUN_LIVE_RETRIEVAL_TESTS: '0'
      # Light core only: no torch, embeddings, Chroma or Ollama in CI.
      UV_NO_DEFAULT_GROUPS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the submission-v1 tag is needed to verify frozen runtime code
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked, core only)
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check
      - name: Offline tests (live tests report explicit skips)
        run: uv run python -m unittest discover -s tests -v
      - name: Corpus, frozen experiment-01 evidence and tagged runtime code
        run: |
          uv run bls-rag corpus verify
          uv run bls-rag verify
          uv run python -m scripts.verify_frozen_tag
      - name: Publication path and secret-pattern scan
        run: uv run python -m scripts.publication_audit
