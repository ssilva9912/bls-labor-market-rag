[project]
name = "bls-rag-finetune"
version = "0.1.0"
description = "QLoRA training environment for experiment 02 (Linux/WSL2 + NVIDIA GPU only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "unsloth>=2025.10",
    "datasets>=3",
]

[tool.uv]
package = false
# CUDA wheels only exist for Linux; this environment is meant for WSL2, not native Windows.
environments = ["sys_platform == 'linux'"]
