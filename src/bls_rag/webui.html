<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLS Labor Market Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
    --accent: #1f5fbf; --accent-text: #ffffff; --chip: #e6eefb; --chip-text: #1a4a96;
    --warn-bg: #fff4d6; --warn-text: #6b4e00; --error-bg: #fde8e6; --error-text: #8a1f14;
    --excerpt: #f3f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --panel: #1d2127; --text: #e8eaed; --muted: #9aa3ae; --line: #30363d;
      --accent: #6ea4f4; --accent-text: #0e1420; --chip: #25344d; --chip-text: #a9c8fa;
      --warn-bg: #3b3115; --warn-text: #f2d98a; --error-bg: #442019; --error-text: #f5b5ac;
      --excerpt: #171a1f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 18px 16px 6px; }
  .wrap { width: 100%; max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  main { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .notice { border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: .92rem; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); }
  .notice.error { background: var(--error-bg); color: var(--error-text); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  .empty { color: var(--muted); margin: 28px 0 8px; }
  .examples { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .examples button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: inherit; font-size: .93rem; text-align: left; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); }
  .turn { margin: 18px 0; }
  .question { font-weight: 600; margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .answer { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .meta { color: var(--muted); font-size: .82rem; margin: 10px 0 0; }
  .cite {
    display: inline-block; background: var(--chip); color: var(--chip-text); border: 0; border-radius: 5px;
    padding: 0 6px; margin: 0 1px; font: inherit; font-size: .82em; font-weight: 600; cursor: pointer;
  }
  .sources { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .sources h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  details { border-radius: 6px; padding: 4px 6px; margin: 0 -6px; }
  details.flash { background: var(--chip); }
  summary { cursor: pointer; font-size: .92rem; overflow-wrap: anywhere; }
  summary a {
    display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 1px 9px; vertical-align: middle;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text);
    font-size: .8rem; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  summary a svg { width: 13px; height: 13px; }
  summary a:hover { border-color: var(--accent); color: var(--accent); }
  summary a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .excerpt {
    background: var(--excerpt); border-radius: 6px; padding: 10px; margin: 6px 0 4px; max-height: 260px;
    overflow: auto; white-space: pre-wrap; font: .8rem/1.45 ui-monospace, Consolas, monospace;
  }
  .pending { color: var(--muted); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px 14px; }
  textarea {
    width: 100%; min-height: 54px; max-height: 180px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit;
  }
  textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 8px; }
  .controls label { font-size: .9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select {
    font: inherit; font-size: .9rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); max-width: 100%;
  }
  .send {
    margin-left: auto; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
    padding: 8px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>BLS Labor Market Assistant</h1>
  <p class="sub">Answers from eight official BLS releases, generated on this computer with Ollama.</p>
</div></header>

<main id="main"><div class="wrap">
  <div id="notices"></div>
  <div id="empty">
    <p class="empty">Ask about unemployment, wages, job openings or employment projections. Each question is answered on its own; earlier questions are not remembered.</p>
    <div class="examples" id="examples"></div>
  </div>
  <div id="turns" aria-live="polite"></div>
</div></main>

<footer><div class="wrap">
  <form id="form">
    <textarea id="question" placeholder="Ask a question about the BLS reports" aria-label="Question" maxlength="2000"></textarea>
    <div class="controls">
      <label>Model <select id="model"></select></label>
      <label><input type="checkbox" id="documents" checked> Answer from the documents</label>
      <button class="send" id="send" type="submit">Ask</button>
    </div>
  </form>
</div></footer>

<script>
const EXAMPLES = [
  "Which states had the lowest and highest annual average unemployment rates in 2024?",
  "How many job openings were there at the end of December 2024?",
  "Which occupations are projected to grow fastest from 2024 to 2034?",
];
const PDF_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3.75 1.75h5.5l3 3v9.5h-8.5z"/><path d="M9.25 1.75v3h3"/><path d="M6 8.5h4M6 11h4" stroke-linecap="round"/></svg>';
const $ = id => document.getElementById(id);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
let busy = false;

function notice(kind, parts) {
  const box = el('div', 'notice ' + kind);
  for (const part of parts) box.append(part.code ? el('code', '', part.code) : part);
  $('notices').append(box);
}

function setBusy(value) {
  busy = value;
  $('send').disabled = value || !$('model').value;
  $('send').textContent = value ? 'Answering…' : 'Ask';
}

async function loadStatus() {
  let status;
  try {
    status = await (await fetch('/api/status')).json();
  } catch {
    notice('error', ['The UI server is not responding. Restart it with ', {code: 'uv run bls-rag ui'}, '.']);
    return;
  }
  if (status.ollama_error) notice('error', [status.ollama_error]);
  else if (!status.models.length) notice('error', ['No chat models are installed in Ollama. Run ', {code: 'ollama pull llama3.1:8b'}, ' and reload.']);
  if (!status.index_ready) {
    notice('warn', ['The document index has not been built, so only closed-book answers work. Run ', {code: 'uv run bls-rag ingest'}, ' and reload.']);
    $('documents').checked = false;
    $('documents').disabled = true;
  }
  const saved = localStorage.getItem('bls-rag-model');
  for (const name of status.models) $('model').append(new Option(name, name));
  $('model').value = status.models.includes(saved) ? saved : status.default_model;
  setBusy(false);
}

function renderAnswer(target, text, turn) {
  // Turn [S1] citations into buttons that reveal the matching source.
  for (const piece of text.split(/(\[S\d+\])/)) {
    const match = piece.match(/^\[S(\d+)\]$/);
    const source = match && turn.querySelector(`details[data-rank="${match[1]}"]`);
    if (!source) { target.append(piece); continue; }
    const chip = el('button', 'cite', 'S' + match[1]);
    chip.type = 'button';
    chip.title = source.dataset.label;
    chip.addEventListener('click', () => {
      source.open = true;
      source.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      source.classList.add('flash');
      setTimeout(() => source.classList.remove('flash'), 1200);
    });
    target.append(chip);
  }
}

function renderSources(card, sources) {
  if (!sources.length) return;
  const box = el('div', 'sources');
  box.append(el('h2', '', 'Pages given to the model'));
  for (const s of sources) {
    const item = el('details');
    item.dataset.rank = s.rank;
    item.dataset.label = `${s.source}, page ${s.page}`;
    const summary = el('summary', '', `S${s.rank} · ${s.source}, page ${s.page}`);
    const link = el('a');
    link.innerHTML = PDF_ICON;  // fixed markup, no page data
    link.append(`PDF · p. ${s.page}`);
    link.title = `Open ${s.source} at page ${s.page} in a new tab`;
    link.href = `/pdf/${encodeURIComponent(s.source)}#page=${s.page}`;
    link.target = '_blank';
    link.rel = 'noopener';
    summary.append(link);
    item.append(summary, el('div', 'excerpt', s.excerpt));
    box.append(item);
  }
  card.append(box);
}

async function ask(question) {
  if (busy || !question.trim()) return;
  setBusy(true);
  $('empty').hidden = true;
  const turn = el('div', 'turn');
  const card = el('div', 'card');
  const useDocuments = $('documents').checked;
  const started = Date.now();
  const pending = el('p', 'answer pending');
  const tick = () => {
    const seconds = Math.round((Date.now() - started) / 1000);
    pending.textContent = `${useDocuments ? 'Finding pages and writing an answer' : 'Writing an answer'}… ${seconds} s`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  card.append(pending);
  turn.append(el('p', 'question', question.trim()), card);
  $('turns').append(turn);
  $('main').scrollTop = $('main').scrollHeight;

  let result;
  try {
    const response = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, model: $('model').value, use_documents: useDocuments}),
    });
    result = await response.json();
  } catch {
    result = {error: 'The UI server stopped responding. Restart it and try again.'};
  }
  clearInterval(timer);
  card.textContent = '';
  if (result.error) {
    card.append(el('div', 'notice error', result.error));
  } else {
    renderSources(card, result.sources);
    const answer = el('p', 'answer');
    renderAnswer(answer, result.answer.trim(), turn);
    const tokens = result.output_tokens ? ` · ${result.output_tokens} tokens` : '';
    const mode = result.use_documents ? 'from the documents' : 'closed book, no documents';
    card.prepend(answer, el('p', 'meta', `${result.model} · ${mode} · ${result.seconds} s${tokens}`));
  }
  setBusy(false);
  $('main').scrollTop = $('main').scrollHeight;
  $('question').focus();
}

for (const text of EXAMPLES) {
  const button = el('button', '', text);
  button.type = 'button';
  button.addEventListener('click', () => ask(text));
  $('examples').append(button);
}
$('form').addEventListener('submit', event => {
  event.preventDefault();
  const question = $('question').value;
  if (busy || !question.trim()) return;
  $('question').value = '';
  ask(question);
});
$('question').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('form').requestSubmit(); }
});
$('model').addEventListener('change', () => localStorage.setItem('bls-rag-model', $('model').value));
setBusy(true);
loadStatus();
$('question').focus();
</script>
</body>
</html>
