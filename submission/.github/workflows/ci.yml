name: BLS Labor Market RAG offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_LIVE_OLLAMA_TESTS: '0'
      RUN_LIVE_RETRIEVAL_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install offline test dependencies (no models)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Run automated tests (live tests report explicit skips)
        run: python -m unittest discover -s tests -v
      - name: Validate published submission offline
        run: |
          python sources.py verify
          python verify_submission.py --offline
          python verify_submission.py --offline --package submission
      - name: Publication inventory and secret-pattern check
        run: python publication_audit.py --check
